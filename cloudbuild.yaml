steps:
  # 1. Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/qualificando-images/qualificando-frontend:$SHORT_SHA'
      - '-t'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/qualificando-images/qualificando-frontend:latest'
      - '.'

  # 2. Push das tags pro Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/qualificando-images/qualificando-frontend'

  # 3. Deploy no Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'qualificando-frontend'
      - '--image=southamerica-east1-docker.pkg.dev/$PROJECT_ID/qualificando-images/qualificando-frontend:$SHORT_SHA'
      - '--region=southamerica-east1'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/qualificando-images/qualificando-frontend'

options:
  logging: CLOUD_LOGGING_ONLY